name: Setup environment
description: Install uv with Python, the Qt runtime libraries on Linux, and the project dependencies. Assumes the repo is already checked out.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: '3.14'

    - name: Install system dependencies
      # Importing QtWidgets and QtGui needs libEGL and the xcb libraries on
      # Linux, even on the offscreen platform the tests run on.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-util1 libxcb-render-util0 libxcb-image0 libxcb-shape0 libxcb-xkb1 libxcb-icccm4 libxcb-keysyms1

    - name: Install dependencies
      shell: bash
      run: uv sync --group dev
