name: Build Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Get version from Python package
      id: version
      run: |
        VERSION=$(python3 -c "exec(open('src/detectorist/_version.py').read()); print(__version__)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

  build-linux:
    needs: get-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with: # Pull models using git-lfs for releases only
        lfs: ${{ github.event_name == 'release' }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build Linux binary
      run: |
        source .venv/bin/activate
        poe build-linux

    - name: Tar Linux binary
      run: |
        cd dist/linux
        tar cfz Detectorist-linux-x64.tar.gz Detectorist-${{ env.VERSION }}

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-linux-x64.tar.gz
        path: dist/linux/Detectorist-linux-x64.tar.gz

  build-linux-arm64:
    needs: get-version
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with: # Pull models using git-lfs for releases only
        lfs: ${{ github.event_name == 'release' }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build Linux binary
      run: |
        source .venv/bin/activate
        poe build-linux

    - name: Tar Linux binary
      run: |
        cd dist/linux
        tar cfz Detectorist-linux-arm64.tar.gz Detectorist-${{ env.VERSION }}

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-linux-arm64.tar.gz
        path: dist/linux/Detectorist-linux-arm64.tar.gz

  build-macos:
    needs: get-version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with: # Pull models using git-lfs for releases only
        lfs: ${{ github.event_name == 'release' }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build macOS app
      run: |
        source .venv/bin/activate
        poe build-mac

    - name: Zip macOS app
      run: |
        cd dist/macos
        zip -r Detectorist-macos-arm64.zip Detectorist-${{ env.VERSION }}.app

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-macos-arm64.zip
        path: dist/macos/Detectorist-macos-arm64.zip

  build-macos-intel:
    needs: get-version
    runs-on: macos-15-intel
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with: # Pull models using git-lfs for releases only
        lfs: ${{ github.event_name == 'release' }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build macOS app
      run: |
        source .venv/bin/activate
        poe build-mac

    - name: Zip macOS app
      run: |
        cd dist/macos
        zip -r Detectorist-macos-x64.zip Detectorist-${{ env.VERSION }}.app

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-macos-x64.zip
        path: dist/macos/Detectorist-macos-x64.zip

  build-windows:
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with: # Pull models using git-lfs for releases only
        lfs: ${{ github.event_name == 'release' }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build Windows executable
      run: |
        .\.venv\Scripts\activate
        poe build-windows

    - name: Zip Windows executable
      run: |
        Compress-Archive -Path dist/windows/Detectorist-${{ env.VERSION }}.exe -DestinationPath dist/windows/Detectorist-windows-x64.zip

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-windows-x64.zip
        path: dist/windows/Detectorist-windows-x64.zip

# Windows on ARM is disabled because onnxruntime doesn't provide wheels for win_arm64.
# See: https://github.com/microsoft/onnxruntime/issues/27123.
  build-windows-arm64:
    if: false
    needs: get-version
    runs-on: windows-11-arm
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with: # Pull models using git-lfs for releases only
        lfs: ${{ github.event_name == 'release' }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build Windows executable
      run: |
        .\.venv\Scripts\activate
        poe build-windows

    - name: Zip Windows executable
      run: |
        Compress-Archive -Path dist/windows/Detectorist-${{ env.VERSION }}.exe -DestinationPath dist/windows/Detectorist-windows-arm64.zip

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-windows-arm64.zip
        path: dist/windows/Detectorist-windows-arm64.zip

  create-release:
    # NOTE: `build-windows-arm64` removed from needs until onnxruntime provides wheels for win_arm64
    needs: [build-linux, build-linux-arm64, build-macos, build-macos-intel, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true # downloads artifacts directly into the current directory (instead of separate folders)

    - name: List contents
      run: ls -la

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: |
          Detectorist-linux-x64.tar.gz
          Detectorist-linux-arm64.tar.gz
          Detectorist-macos-arm64.zip
          Detectorist-macos-x64.zip
          Detectorist-windows-x64.zip
          # Detectorist-windows-arm64.zip  # Disabled until onnxruntime provides wheels for win_arm64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
