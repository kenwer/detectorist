name: Build Application

on:
  # No push trigger: the Test workflow covers pushes, and a build is started
  # by hand, by a release, or by a pull request that changes the build inputs.
  pull_request:
    branches: ["main"]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - 'packaging/**'
      - 'scripts/strip_macos_bundle.py'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux (x86_64)
            os_name: linux
            arch: x86_64
            build_task: build-linux
            asset: Detectorist-linux-x86_64.AppImage
          - os: ubuntu-24.04-arm
            name: Linux (arm64)
            os_name: linux
            arch: aarch64
            build_task: build-linux
            asset: Detectorist-linux-aarch64.AppImage
          - os: macos-latest
            name: macOS (arm64)
            os_name: macos
            arch: arm64
            build_task: build-mac
            asset: Detectorist-macos-arm64.dmg
          - os: windows-latest
            name: Windows (x86_64)
            os_name: windows
            arch: x86_64
            build_task: build-windows
            asset: Detectorist-windows-x86_64-setup.exe
          # Disabled: opencv-python has no win_arm64 wheels yet
          # https://github.com/opencv/opencv-python/issues/806
          # - os: windows-11-arm
          #   name: Windows (arm64)
          #   os_name: windows
          #   arch: aarch64
          #   build_task: build-windows
          #   asset: Detectorist-windows-aarch64-setup.exe

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

      # On pull_request the Test workflow already ran these on this commit
      - name: Lint
        if: github.event_name != 'pull_request'
        run: uv run poe lint

      - name: Test
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        run: uv run poe test

      - name: Build
        run: uv run poe ${{ matrix.build_task }}

      # The build task writes the installer under its release asset name
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.os_name }}-${{ matrix.arch }}/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.os_name }}-${{ matrix.arch }}/${{ matrix.asset }}
          fail_on_unmatched_files: true
