name: Build Application

on:
  # No push trigger: the Test workflow covers pushes, and a build is started
  # by hand, by a release, or by a pull request that changes the build inputs.
  pull_request:
    branches: ["main"]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build:
    name: Build (${{ matrix.name }})
    needs: get-version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (x86_64)
            os_name: linux
            arch: x86_64
            build_task: build-linux
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            name: Linux (arm64)
            os_name: linux
            arch: aarch64
            build_task: build-linux
            archive_ext: tar.gz
          - os: macos-latest
            name: macOS (arm64)
            os_name: macos
            arch: arm64
            build_task: build-mac
            archive_ext: zip
          - os: windows-latest
            name: Windows (x86_64)
            os_name: windows
            arch: x86_64
            build_task: build-windows
            archive_ext: zip
          # Disabled: onnxruntime has no win_arm64 wheels yet
          # https://github.com/microsoft/onnxruntime/issues/27123
          # - os: windows-11-arm
          #   name: Windows (arm64)
          #   os_name: windows
          #   arch: aarch64
          #   build_task: build-windows
          #   archive_ext: zip

    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-env

      # On pull_request the Test workflow already ran these on this commit
      - name: Lint
        if: github.event_name != 'pull_request'
        run: uv run poe lint

      - name: Test
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        run: uv run poe test

      - name: Build
        run: uv run poe ${{ matrix.build_task }}

      - name: Package archive
        shell: bash
        run: |
          dist_dir="dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          versioned="Detectorist-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          archive="Detectorist-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.archive_ext }}"
          case "${{ matrix.os_name }}" in
            linux)   (cd "$dist_dir" && tar  -czf  "$archive" "$versioned") ;;
            macos)   (cd "$dist_dir" && zip  -r -9  "$archive" "${versioned}.app") ;;
            windows) (cd "$dist_dir" && 7z a -mx=9 "$archive" "${versioned}.exe") ;;
          esac
          echo "ARCHIVE=${dist_dir}/${archive}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Detectorist-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.archive_ext }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true
