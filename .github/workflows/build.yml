name: Build Application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Get version
        id: version
        run: |
          VERSION=$(uv run python -c "from detectorist._version import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build:
    name: Build (${{ matrix.name }})
    needs: get-version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (x86_64)
            os_name: linux
            arch: x86_64
            build_task: build-linux
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            name: Linux (arm64)
            os_name: linux
            arch: aarch64
            build_task: build-linux
            archive_ext: tar.gz
          - os: macos-latest
            name: macOS (arm64)
            os_name: macos
            arch: arm64
            build_task: build-mac
            archive_ext: zip
          - os: macos-15-intel
            name: macOS (x86_64)
            os_name: macos
            arch: x86_64
            build_task: build-mac
            archive_ext: zip
          - os: windows-latest
            name: Windows (x86_64)
            os_name: windows
            arch: x86_64
            build_task: build-windows
            archive_ext: zip
          # Disabled: onnxruntime has no win_arm64 wheels yet
          # https://github.com/microsoft/onnxruntime/issues/27123
          # - os: windows-11-arm
          #   name: Windows (arm64)
          #   os_name: windows
          #   arch: aarch64
          #   build_task: build-windows
          #   archive_ext: zip

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.13'

      - name: Fix Homebrew OpenSSL symlinks
        # Nuitka's dependency scanner compares the path where it finds a library against
        # that library's own LC_ID_DYLIB install name (baked into the Mach-O header).
        # Homebrew installs /usr/local/lib/libcrypto.dylib as a symlink whose target has
        # install name /usr/local/opt/openssl@3/lib/libcrypto.3.dylib — a mismatch that
        # triggers Nuitka's FATAL. Replacing the symlink with a real copy and rewriting
        # the install name to match the file's new location fixes the check.
        if: matrix.os == 'macos-15-intel'
        run: |
          for lib in /usr/local/lib/libcrypto.dylib /usr/local/lib/libssl.dylib; do
            if [ -L "$lib" ]; then
              real=$(readlink -f "$lib")
              sudo rm "$lib"
              sudo cp "$real" "$lib"
              # Rewrite the embedded LC_ID_DYLIB so the file's identity matches its path.
              sudo install_name_tool -id "$lib" "$lib"
            fi
          done
          # libssl's LC_LOAD_DYLIB entry for libcrypto still points at the Cellar/opt path,
          # which Nuitka resolves to the Cellar file whose own LC_ID_DYLIB uses the /opt
          # path — a second mismatch. Rewrite that reference to our already-fixed copy.
          CRYPTO_REF=$(otool -L /usr/local/lib/libssl.dylib | awk '/libcrypto/{print $1}')
          if [ -n "$CRYPTO_REF" ] && [ "$CRYPTO_REF" != "/usr/local/lib/libcrypto.dylib" ]; then
            sudo install_name_tool -change "$CRYPTO_REF" "/usr/local/lib/libcrypto.dylib" \
              /usr/local/lib/libssl.dylib
          fi

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run poe lint

      - name: Test
        run: uv run poe test

      - name: Build
        run: uv run poe ${{ matrix.build_task }}

      - name: Package archive
        shell: bash
        run: |
          dist_dir="dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          versioned="Detectorist-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          archive="Detectorist-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.archive_ext }}"
          case "${{ matrix.os_name }}" in
            linux)   (cd "$dist_dir" && tar  -czf  "$archive" "$versioned") ;;
            macos)   (cd "$dist_dir" && zip  -r -9  "$archive" "${versioned}.app") ;;
            windows) (cd "$dist_dir" && 7z a -mx=9 "$archive" "${versioned}.exe") ;;
          esac
          echo "ARCHIVE=${dist_dir}/${archive}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Detectorist-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.archive_ext }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true
