name: Build Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Get version from Python package
      id: version
      run: |
        VERSION=$(python3 -c "exec(open('src/detectorist/_version.py').read()); print(__version__)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

  build-linux:
    needs: get-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build Linux binary
      run: |
        source .venv/bin/activate
        poe build-linux

    - name: Tar Linux binary
      run: |
        cd dist/linux-x86_64
        tar cfz Detectorist-linux-x86_64.tar.gz Detectorist-${{ env.VERSION }}-linux-x86_64

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-linux-x86_64.tar.gz
        path: dist/linux-x86_64/Detectorist-linux-x86_64.tar.gz

  build-linux-arm64:
    needs: get-version
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build Linux binary
      run: |
        source .venv/bin/activate
        poe build-linux

    - name: Tar Linux binary
      run: |
        cd dist/linux-aarch64
        tar cfz Detectorist-linux-aarch64.tar.gz Detectorist-${{ env.VERSION }}-linux-aarch64

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-linux-aarch64.tar.gz
        path: dist/linux-aarch64/Detectorist-linux-aarch64.tar.gz

  build-macos:
    needs: get-version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build macOS app
      run: |
        source .venv/bin/activate
        poe build-mac

    - name: Zip macOS app
      run: |
        cd dist/macos-arm64
        zip -r Detectorist-macos-arm64.zip Detectorist-${{ env.VERSION }}-macos-arm64.app

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-macos-arm64.zip
        path: dist/macos-arm64/Detectorist-macos-arm64.zip

  build-macos-intel:
    needs: get-version
    runs-on: macos-15-intel
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      # Force uv to use its managed Python (python-build-standalone) instead of the
      # actions/setup-python framework Python. Framework Python installs to
      # /Library/Frameworks/, which Nuitka treats as a system path and won't bundle,
      # causing @executable_path/Python link errors at runtime.
      UV_PYTHON_PREFERENCE: only-managed

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.13'

    - name: Fix Homebrew OpenSSL symlinks
      # Nuitka's dependency scanner compares the path where it finds a library against
      # that library's own LC_ID_DYLIB install name (baked into the Mach-O header).
      # Homebrew installs /usr/local/lib/libcrypto.dylib as a symlink whose target has
      # install name /usr/local/opt/openssl@3/lib/libcrypto.3.dylib — a mismatch that
      # triggers Nuitka's FATAL. Replacing the symlink with a real copy and rewriting
      # the install name to match the file's new location fixes the check.
      run: |
        for lib in /usr/local/lib/libcrypto.dylib /usr/local/lib/libssl.dylib; do
          if [ -L "$lib" ]; then
            real=$(readlink -f "$lib")
            sudo rm "$lib"
            sudo cp "$real" "$lib"
            # Rewrite the embedded LC_ID_DYLIB so the file's identity matches its path.
            sudo install_name_tool -id "$lib" "$lib"
          fi
        done
        # libssl's LC_LOAD_DYLIB entry for libcrypto still points at the Cellar/opt path,
        # which Nuitka resolves to the Cellar file whose own LC_ID_DYLIB uses the /opt
        # path — a second mismatch. Rewrite that reference to our already-fixed copy.
        CRYPTO_REF=$(otool -L /usr/local/lib/libssl.dylib | awk '/libcrypto/{print $1}')
        if [ -n "$CRYPTO_REF" ] && [ "$CRYPTO_REF" != "/usr/local/lib/libcrypto.dylib" ]; then
          sudo install_name_tool -change "$CRYPTO_REF" "/usr/local/lib/libcrypto.dylib" \
            /usr/local/lib/libssl.dylib
        fi

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build macOS app
      run: |
        source .venv/bin/activate
        poe build-mac

    - name: Zip macOS app
      run: |
        cd dist/macos-x86_64
        zip -r Detectorist-macos-x86_64.zip Detectorist-${{ env.VERSION }}-macos-x86_64.app

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-macos-x86_64.zip
        path: dist/macos-x86_64/Detectorist-macos-x86_64.zip

  build-windows:
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build Windows executable
      run: |
        .\.venv\Scripts\activate
        poe build-windows

    - name: Zip Windows executable
      run: |
        Compress-Archive -Path dist/windows-x86_64/Detectorist-${{ env.VERSION }}-windows-x86_64.exe -DestinationPath dist/windows-x86_64/Detectorist-windows-x86_64.zip

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-windows-x86_64.zip
        path: dist/windows-x86_64/Detectorist-windows-x86_64.zip

# Windows on ARM is disabled because onnxruntime doesn't provide wheels for win_arm64.
# See: https://github.com/microsoft/onnxruntime/issues/27123.
  build-windows-arm64:
    if: false
    needs: get-version
    runs-on: windows-11-arm
    env:
      VERSION: ${{ needs.get-version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv venv
        uv sync --group dev

    - name: Lint code
      run: uv run poe ruff

    - name: Build Windows executable
      run: |
        .\.venv\Scripts\activate
        poe build-windows

    - name: Zip Windows executable
      run: |
        Compress-Archive -Path dist/windows-aarch64/Detectorist-${{ env.VERSION }}-windows-aarch64.exe -DestinationPath dist/windows-aarch64/Detectorist-windows-aarch64.zip

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: Detectorist-windows-aarch64.zip
        path: dist/windows-aarch64/Detectorist-windows-aarch64.zip

  create-release:
    # NOTE: `build-windows-arm64` removed from needs until onnxruntime provides wheels for win_arm64
    needs: [build-linux, build-linux-arm64, build-macos, build-macos-intel, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true # downloads artifacts directly into the current directory (instead of separate folders)

    - name: List contents
      run: ls -la

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: |
          Detectorist-linux-x86_64.tar.gz
          Detectorist-linux-aarch64.tar.gz
          Detectorist-macos-arm64.zip
          Detectorist-macos-x86_64.zip
          Detectorist-windows-x86_64.zip
          # Detectorist-windows-aarch64.zip  # Disabled until onnxruntime provides wheels for win_arm64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
