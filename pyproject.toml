[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "detectorist"
version = "0.13.2"

description = "A desktop application for sorting and cropping photos using a machine learning for object detection."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "onnxruntime",
    "opencv-python",
    "packaging",
    "pillow-heif",
    "PySide6-Essentials>=6.12",
    "rawpy",
    "numpy",
    "piexif",
    # Pinned: the success-toast link reaches a private label attr (_Toast__text_label);
    # re-verify that hook before bumping. See src/detectorist/toasts.py
    "pyqt-toast-notification==1.3.3",
]

[dependency-groups]
dev = [
    "ruff",
    "nuitka",
    "imageio",
    "poethepoet",
    "md-toc",
    "pytest>=9.1.1",
    "pytest-qt>=4.5",
]

[project.scripts]
detectorist = "detectorist.main:main"

[tool.poe.tasks]
compile-ui = { shell = "for f in src/detectorist/*.ui; do base=\"${f%.ui}\"; out=\"${base%/*}/ui_${base##*/}.py\"; pyside6-uic --from-imports \"$f\" -o \"$out\"; done", help = "Compile Qt UI files to Python files with relative imports" }
# --format-version 1 omits per-file timestamps for reproducible output as setting SOURCE_DATE_EPOCH=0 does not work (Qt treats 0 as "not set" see QTBUG-62511).
compile-qrc = { shell = "for f in src/detectorist/*.qrc; do pyside6-rcc --format-version 1 \"$f\" -o \"${f%.qrc}_rc.py\"; done", help = "Compile Qt resource files to Python files" }

run-app = { cmd = "uv run src/detectorist/main.py", help = "Run the application" }
run = { sequence = ["compile-ui", "compile-qrc", "run-app"], help = "Compile UI and resource files and run the application" }
test = { sequence = ["compile-ui", "compile-qrc", { cmd = "pytest" }], help = "Compile UI/resources, then run all tests" }
test-fast = { sequence = ["compile-ui", "compile-qrc", { cmd = "pytest -m 'not slow'" }], help = "Compile UI/resources, then run only the fast tests" }
test-slow = { sequence = ["compile-ui", "compile-qrc", { cmd = "pytest -m slow" }], help = "Compile UI/resources, then run only the slow tests that load the real models from ./models" }
install-hooks = { cmd = "git config core.hooksPath .githooks", help = "Point git at the repo's tracked hooks (pre-push runs test-fast)" }

get_app_version = { cmd = "uv version --short --frozen", help = "Get the application version" }

clean-dist = { shell = "rm -rf ./dist/*", help = "Clean the dist directory" }

bench = { cmd = "python benchmarks/bench_conversions.py", help = "Time the image conversion hot paths" }

lint = { cmd = "ruff check src tests", help = "Run ruff linter" }
fmt = { cmd = "ruff format src tests", help = "Run ruff formatter" }

[tool.poe.tasks.build]
help = "Build for the current platform"
shell = """
case "$(uname -s)" in
    Darwin) poe build-mac ;;
    Linux) poe build-linux ;;
    MINGW*|MSYS*|CYGWIN*) poe build-windows ;;
    *) echo "Unsupported OS: $(uname -s)"; exit 1 ;;
esac
"""

# set -e fails the build tasks on a failed Nuitka run, which the trailing commands would otherwise hide

# A folder build wrapped in an AppImage instead of a onefile binary, the format Linux users expect.
# The pinned upstream appimagetool embeds the static type2 runtime, so the AppImage runs without
# libfuse2. Nuitka's default download is the older AppImageKit one.
[tool.poe.tasks.build-linux]
shell = """
set -e
ARCH=$(uname -m)
VERSION=$(poe get_app_version)
OUTPUT_DIR=dist/linux-$ARCH
rm -rf "$OUTPUT_DIR"
APPIMAGETOOL_VERSION=1.9.1
case "$ARCH" in
    x86_64) APPIMAGETOOL_SHA256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 ;;
    aarch64) APPIMAGETOOL_SHA256=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158 ;;
    *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
esac
TOOL_DIR=dist/tools/appimagetool-$APPIMAGETOOL_VERSION-$ARCH
if ! echo "$APPIMAGETOOL_SHA256  $TOOL_DIR/appimagetool" | sha256sum --check --status 2>/dev/null; then
    mkdir -p "$TOOL_DIR"
    curl -fsSL -o "$TOOL_DIR/appimagetool" \
        "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-$ARCH.AppImage"
    echo "$APPIMAGETOOL_SHA256  $TOOL_DIR/appimagetool" | sha256sum --check
fi
chmod +x "$TOOL_DIR/appimagetool"
# appimagetool is itself an AppImage, and CI runners may lack FUSE
export APPIMAGE_EXTRACT_AND_RUN=1
nuitka \
    --standalone \
    --enable-plugin=pyside6 \
    --noinclude-qt-translations \
    --noinclude-dlls='*.cpp.o' \
    --noinclude-dlls='*.qsb' \
    --include-qt-plugins=platforminputcontexts \
    --include-package-data=pyqttoast \
    --disable-ccache \
    --output-dir="$OUTPUT_DIR" \
    --remove-output \
    --company-name=de.ken \
    --product-name=Detectorist \
    --product-version=$VERSION \
    --linux-icon=assets/icon.png \
    --output-filename=Detectorist \
    --linux-create-installer \
    --linux-installer-output="$OUTPUT_DIR/Detectorist-linux-$ARCH.AppImage" \
    --linux-installer-appimagetool-path="$TOOL_DIR" \
    ./src/detectorist/main.py
"""
deps = ["compile-ui", "compile-qrc"]
help = "Build the application and its AppImage for Linux"

# No platforminputcontexts plugins: on macOS PySide6-Essentials only ships the virtual keyboard one,
# without the QtVirtualKeyboard frameworks it links against, so Nuitka fails to resolve it
[tool.poe.tasks.build-mac]
shell = """
set -e
ARCH=$(uname -m)
VERSION=$(poe get_app_version)
OUTPUT_DIR=dist/macos-$ARCH
rm -rf "$OUTPUT_DIR"
nuitka \
    --standalone \
    --macos-create-app-bundle \
    --macos-app-icon=assets/icon.png \
    --enable-plugin=pyside6 \
    --noinclude-qt-translations \
    --noinclude-dlls='*.cpp.o' \
    --noinclude-dlls='*.qsb' \
    --include-package-data=pyqttoast \
    --disable-ccache \
    --output-dir="$OUTPUT_DIR" \
    --remove-output \
    --product-name=Detectorist \
    --macos-app-name=Detectorist \
    --macos-app-version=$VERSION \
    --macos-signed-app-name=de.ken.detectorist \
    --output-filename=Detectorist \
    ./src/detectorist/main.py
# Unversioned, so Dock items survive an update
APP="$OUTPUT_DIR/Detectorist.app"
mv "$OUTPUT_DIR/main.app" "$APP"
# Plain hdiutil rather than create-dmg: no Finder AppleScript to hang on a headless runner.
# The staging folder puts the app next to an Applications link for drag-to-install.
STAGE="$OUTPUT_DIR/dmg-stage"
mkdir "$STAGE"
mv "$APP" "$STAGE/"
ln -s /Applications "$STAGE/Applications"
# GitHub's macOS runners intermittently fail hdiutil with "Resource busy" (actions/runner-images#7522)
for attempt in 1 2 3 4 5; do
    hdiutil create -volname Detectorist -srcfolder "$STAGE" -fs HFS+ -format ULFO -ov \
        "$OUTPUT_DIR/Detectorist-macos-$ARCH.dmg" && break
    [ "$attempt" = 5 ] && exit 1
    echo "hdiutil failed (attempt $attempt/5), retrying..."
    sleep 10
done
mv "$STAGE/Detectorist.app" "$APP"
rm -rf "$STAGE"
"""
deps = ["compile-ui", "compile-qrc"]
help = "Build the application and its DMG for macOS"


# A folder build wrapped in an Inno Setup installer instead of a onefile exe: nothing is extracted
# on each start, which made it slow and tripped virus scanners.
# MSYS_NO_PATHCONV keeps Git Bash from rewriting ISCC's /D options as paths.
[tool.poe.tasks.build-windows]
shell = """
set -e
ARCH=$(uname -m)
VERSION=$(poe get_app_version)
OUTPUT_DIR=dist/windows-$ARCH
rm -rf "$OUTPUT_DIR"
nuitka.cmd \
    --standalone \
    --enable-plugin=pyside6 \
    --windows-icon-from-ico=assets/icon.ico \
    --noinclude-qt-translations \
    --noinclude-dlls='*.cpp.o' \
    --noinclude-dlls='*.qsb' \
    --include-qt-plugins=platforminputcontexts \
    --include-package-data=pyqttoast \
    --disable-ccache \
    --output-dir="$OUTPUT_DIR" \
    --remove-output \
    --windows-product-name=Detectorist \
    --windows-product-version=$VERSION \
    --windows-file-version=$VERSION \
    --windows-console-mode=attach \
    --output-filename=Detectorist.exe \
    --assume-yes-for-downloads \
    --msvc=latest \
    ./src/detectorist/main.py
mv "$OUTPUT_DIR/main.dist" "$OUTPUT_DIR/Detectorist.dist"
# Preinstalled on GitHub's Windows runners, elsewhere: winget install JRSoftware.InnoSetup
ISCC=$(command -v ISCC || echo "/c/Program Files (x86)/Inno Setup 6/ISCC.exe")
# The installer's version resource takes exactly four numbers
MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' "$ISCC" \
    "/DAppVersion=$VERSION" \
    "/DNumericVersion=$VERSION.0" \
    "/DSourceDir=$(cygpath -w "$PWD/$OUTPUT_DIR/Detectorist.dist")" \
    "/DOutputDir=$(cygpath -w "$PWD/$OUTPUT_DIR")" \
    "/DOutputBaseFilename=Detectorist-windows-$ARCH-setup" \
    "/DIconFile=$(cygpath -w "$PWD/assets/icon.ico")" \
    packaging/windows/detectorist.iss
"""
deps = ["compile-ui", "compile-qrc"]
help = "Build the application and its setup.exe for Windows"


[tool.vscode.tasks]
compile-ui = "poe compile-ui"
compile-qrc = "poe compile-qrc"
run = "poe run-app"
build-and-run = "poe run"

[tool.ruff]
line-length = 120
# Exclude files generated from .ui and .qrc sources
extend-exclude = ["src/detectorist/ui_*.py", "src/detectorist/*_rc.py"]
[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["E501"]
# Select specific error codes to enforce
select = [
    "F",    # Pyflakes (basic Python errors)
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # Import sorting
    "C4",   # Flake8 Comprehensions
    "B",    # Flake8 Bugbear (security and design checks)
    "UP",   # Pyupgrade (modernize Python code)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --no-qt-log: pytest-qt swaps a Python Qt message handler in and out per test.
# PySide6 can segfault when a non-Python thread logs through that handler while
# it is being removed. Qt messages go to stderr instead.
# --durations: list the slowest tests, but only those over a second, so a
# healthy run prints nothing extra and a slow one names the culprit.
addopts = "-ra -q --no-qt-log --durations=15 --durations-min=1.0"
pythonpath = ["src"]
# Dump all-thread tracebacks to stderr when a single test exceeds this many
# seconds, so a hang identifies itself in CI logs (it does not kill the test).
faulthandler_timeout = 120
qt_api = "pyside6"
markers = [
    "slow: opt-in tests that load the real models from ./models (run with: pytest -m slow)",
]
